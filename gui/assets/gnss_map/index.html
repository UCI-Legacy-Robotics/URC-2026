<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background: #0a0a0a;
    }
    /* Dark theme to match the rest of the app instead of Leaflet's default
       white attribution bar / grey background. */
    .leaflet-container {
      background: #0a0a0a;
    }
    .leaflet-control-attribution {
      background: rgba(10, 10, 10, 0.8) !important;
      color: #777 !important;
      font-size: 10px !important;
    }
    .leaflet-control-attribution a {
      color: #999 !important;
    }
    .rover-marker-icon {
      /* Simple CSS arrow/cursor for the rover position marker. Rotation
         is applied by leaflet.rotatedMarker.js based on heading. */
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 22px solid #4a9eff;
      filter: drop-shadow(0 0 3px rgba(74, 158, 255, 0.8));
    }
    .pin-label {
      color: #e0e0e0;
      font-size: 11px;
      font-family: sans-serif;
      background: rgba(10, 10, 10, 0.85);
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid #2a2a2a;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet/leaflet.rotatedMarker.js"></script>
  <script src="app.js"></script>
</body>
</html>
