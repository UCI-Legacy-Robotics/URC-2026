/**:
  ros__parameters:
    image_topic: "/camera1/image_raw"
    detections_topic: "/yolo/detections"
    detections_json_topic: "/yolo/detections_json"
    debug_image_topic: "/yolo/debug_image"
    # Absolute path to a .pt/.onnx/.engine file. Empty uses the model bundled
    # at share/yolo_detector/models/yolo11s.pt. Relative paths are resolved
    # against the node's working directory, not the package - prefer absolute.
    model_path: ""
    confidence_threshold: 0.25
    imgsz: 640
    device: "0"
    image_encoding: "bgr8"
    max_fps: 10.0
    publish_json: true
    publish_debug_image: false
